<section class="relative w-full h-screen overflow-hidden bg-gray-900">
  
  <video 
    autoplay 
    muted 
    loop 
    playsinline 
    class="absolute top-0 left-0 w-full h-full object-cover z-0"
    [poster]="imagenUrl"> 
    <source [src]="videoUrl" type="video/mp4">
  </video>

  <div class="absolute top-0 left-0 w-full h-full bg-black/60 z-10"></div>

  <div class="relative z-20 flex flex-col items-center justify-center h-full px-4 text-center">
    
    <span class="mb-4 py-1 px-3 rounded-full bg-blue-500/20 border border-blue-400 text-blue-100 text-xs font-semibold tracking-wide uppercase backdrop-blur-sm animate-fade-in-down">
      Nueva Plataforma Educativa 2026
    </span>

    <h1 class="mb-6 text-4xl font-extrabold tracking-tight leading-none text-white md:text-5xl lg:text-6xl">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-teal-200">
        {{ titulo }}
      </span>
    </h1>

    <p class="mb-8 text-lg font-normal text-gray-300 lg:text-xl sm:px-16 lg:px-48 max-w-4xl">
      {{ subtitulo }}
    </p>

    <div class="flex flex-col space-y-4 sm:flex-row sm:justify-center sm:space-y-0 sm:space-x-4">
      
      <a routerLink="cursos" class="inline-flex justify-center items-center py-3 px-6 text-base font-medium text-center text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition-all shadow-lg hover:shadow-blue-500/50 cursor-pointer">
        {{txtBotton1}}
        <svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
        </svg>
      </a>

      <a routerLink="linkBoton2" class="inline-flex justify-center items-center py-3 px-6 text-base font-medium text-center text-white rounded-lg border border-white/30 hover:bg-white/10 focus:ring-4 focus:ring-gray-400 backdrop-blur-sm transition-all cursor-pointer">
        <svg class="w-5 h-5 me-2 -ms-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"></path></svg>
        {{txtBotton2}}
      </a>
    </div>

    <div class="absolute bottom-10 animate-bounce">
      <svg class="w-6 h-6 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
    </div>

  </div>
</section>
