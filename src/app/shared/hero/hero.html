<section class="relative w-full h-screen overflow-hidden bg-slate-900">
  
  <video 
    autoplay muted loop playsinline 
    class="absolute top-0 left-0 w-full h-full object-cover z-0 opacity-80"
    [poster]="imagenUrl"> 
    <source [src]="videoUrl" type="video/mp4">
  </video>

  <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-slate-900/80 via-slate-900/60 to-slate-900/90 z-10"></div>

  <div class="relative z-20 flex flex-col items-center justify-center h-full px-4 text-center">
    
    <span class="mb-6 py-1.5 px-4 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-100 text-xs font-semibold tracking-widest uppercase backdrop-blur-md animate-fade-in-down">
      Formación Continua para Educadores
    </span>

    <h1 class="mb-6 text-4xl font-extrabold tracking-tight leading-tight text-white md:text-5xl lg:text-6xl max-w-5xl">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-100 to-violet-200">
        {{ titulo }}
      </span>
    </h1>

    <p class="mb-10 text-lg font-light text-slate-300 lg:text-xl sm:px-16 lg:px-48 max-w-4xl leading-relaxed">
      {{ subtitulo }}
    </p>

    <div class="flex flex-col space-y-4 sm:flex-row sm:justify-center sm:space-y-0 sm:space-x-4">
      
      <a [routerLink]="linkBoton1" class="inline-flex justify-center items-center py-3.5 px-8 text-base font-semibold text-center text-white bg-indigo-600 rounded-xl hover:bg-indigo-500 focus:ring-4 focus:ring-indigo-300 transition-all shadow-lg shadow-indigo-600/30 hover:-translate-y-1 cursor-pointer">
        {{textoBoton1}}
        <svg class="w-4 h-4 ms-2 rtl:rotate-180" fill="none" viewBox="0 0 14 10" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
        </svg>
      </a>

      <a [routerLink]="linkBoton2" class="inline-flex justify-center items-center py-3.5 px-8 text-base font-semibold text-center text-white rounded-xl border border-white/20 hover:bg-white/10 hover:border-white/40 backdrop-blur-sm transition-all cursor-pointer">
        {{textoBoton2}}
      </a>
    </div>
  </div>
</section>
