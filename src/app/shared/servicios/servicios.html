<section class="py-20 bg-gray-50 dark:bg-gray-900 relative">
    <div class="container px-6 mx-auto">

        <div class="text-center max-w-2xl mx-auto mb-16">
            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight">
                Catálogo de 
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-500">
                    Formación
                </span>
            </h2>
            <p class="mt-3 text-gray-600 dark:text-gray-400 text-lg">
                Cursos diseñados para potenciar tus habilidades docentes.
            </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">

            @for (servicio of servicios; track servicio.titulo) {
                <article
                    class="group flex flex-col p-7 bg-white dark:bg-gray-800 rounded-2xl
                           border border-gray-200 dark:border-gray-700
                           shadow-sm hover:shadow-xl hover:-translate-y-2
                           transition-all duration-300 h-full">

                    <div class="mb-4">
                        <span
                            class="inline-flex p-3 rounded-xl 
                                   bg-blue-50 text-blue-600
                                   dark:bg-gray-700 dark:text-gray-300
                                   group-hover:bg-blue-600 group-hover:text-white 
                                   transition-colors duration-300 shadow-sm">

                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </span>
                    </div>

                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">
                        {{ servicio.titulo }}
                    </h3>

                    <p class="text-gray-600 dark:text-gray-400 mb-6 flex-grow leading-relaxed">
                        {{ servicio.descripcion }}
                    </p>

                    <button
                        (click)="abrirModal(servicio)"
                        class="w-full py-3 px-5 text-blue-600 font-semibold rounded-lg
                               bg-gray-100 dark:bg-gray-700
                               hover:bg-blue-600 hover:text-white
                               transition-all duration-300
                               flex items-center justify-center gap-2 group-hover:shadow-md">

                        Ver detalles
                        
                        <svg class="w-4 h-4 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                        </svg>
                    </button>
                </article>
            }

        </div>
    </div>

    @if (cursoSeleccionado) {
        <app-modal
            [curso]="cursoSeleccionado"
            (cerrar)="cerrarModal()">
        </app-modal>
    }
</section>
