<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
    
    <div class="relative w-full max-w-2xl bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden animate-slide-up">
        
        <div class="flex items-center justify-between p-6 border-b border-gray-100 dark:border-gray-700">
            <h3 class="text-2xl font-bold text-gray-900 dark:text-white">
                {{ curso.titulo }}
            </h3>
            <button (click)="close()" class="text-gray-400 hover:text-red-500 transition-colors">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6 space-y-4">
            <span class="inline-block px-3 py-1 text-sm font-semibold text-blue-800 bg-blue-100 rounded-full uppercase">
                {{ curso.tipo }}
            </span>
            
            <p class="text-gray-600 dark:text-gray-300 text-lg leading-relaxed">
                {{ curso.detalle }}
            </p>

            <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg border-l-4 border-blue-500">
                <p class="text-sm italic text-gray-500 dark:text-gray-400">
                    Incluye certificado, acceso de por vida y soporte con el instructor.
                </p>
            </div>
        </div>

        <div class="flex justify-end gap-3 p-6 bg-gray-50 dark:bg-gray-900/50">
            <button (click)="close()" class="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100">
                Cerrar
            </button>
            <button class="px-5 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-lg">
                Inscribirme
            </button>
        </div>
    </div>
</div>
