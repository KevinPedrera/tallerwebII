<nav class="fixed w-full z-50 top-0 start-0 border-b border-gray-100 bg-white/90 backdrop-blur-lg transition-all duration-300">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    
    <a routerLink="/" class="flex items-center space-x-2 rtl:space-x-reverse group">
      <div class="p-1.5 bg-blue-50 rounded-lg text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 14l9-5-9-5-9 5 9 5z" />
            <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
      </div>
      <span class="self-center text-2xl font-bold whitespace-nowrap text-gray-900">
        Edu<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-500">Connect</span>
      </span>
    </a>

    <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      
      <button (click)="toggleMenu()" 
              type="button" 
              class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors"
              [attr.aria-expanded]="isMenuOpen">
        <span class="sr-only">Abrir menú</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="items-center justify-between w-full md:flex md:w-auto md:order-1 transition-all duration-300 ease-in-out" 
         [ngClass]="{'hidden': !isMenuOpen, 'block': isMenuOpen}"
         id="navbar-cta">
      
      <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-2xl bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-transparent">
        
        <li>
          <a routerLink="/" 
             routerLinkActive="text-blue-600 font-bold"
             [routerLinkActiveOptions]="{exact: true}"
             (click)="closeMenu()"
             class="group relative block py-2 px-3 md:p-0 text-gray-700 hover:text-blue-600 transition-colors">
             Inicio
             <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </li>

        <li>
          <a routerLink="cursos" 
             routerLinkActive="text-blue-600 font-bold"
             (click)="closeMenu()"
             class="group relative block py-2 px-3 md:p-0 text-gray-700 hover:text-blue-600 transition-colors">
             Cursos
             <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </li>

        <li>
          <a routerLink="comunidad" 
             routerLinkActive="text-blue-600 font-bold"
             (click)="closeMenu()"
             class="group relative block py-2 px-3 md:p-0 text-gray-700 hover:text-blue-600 transition-colors">
             Comunidad
             <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </li>

        <li>
          <a routerLink="contacto" 
             routerLinkActive="text-blue-600 font-bold"
             (click)="closeMenu()"
             class="group relative block py-2 px-3 md:p-0 text-gray-700 hover:text-blue-600 transition-colors">
             Contacto
             <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </li>


        <li>
          <a routerLink="login" 
             routerLinkActive="text-blue-600 font-bold"
             (click)="closeMenu()"
             class="group relative block py-2 px-3 md:p-0 text-gray-700 hover:text-blue-600 transition-colors">
             Iniciar Sesión
             <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </li>

      </ul>
    </div>
  </div>
</nav>
