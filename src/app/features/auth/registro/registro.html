<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full max-w-5xl pointer-events-none">
      <div class="absolute top-0 right-0 w-72 h-72 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -mt-20 -mr-20"></div>
      <div class="absolute bottom-0 left-0 w-72 h-72 bg-violet-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -mb-20 -ml-20"></div>
  </div>

  <div class="max-w-3xl w-full bg-white p-8 md:p-12 rounded-[2rem] shadow-xl border border-slate-100 relative z-10">

    <div class="text-center mb-10">
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">
        Crea tu cuenta en Didacti<span class="text-indigo-600">Pro</span>
      </h2>
      <p class="mt-3 text-slate-500">Únete a la red de educadores más innovadora y accede a recursos exclusivos.</p>
    </div>

    @if (mensajeError) {
      <div class="bg-red-50 text-red-700 p-4 rounded-xl mb-8 text-sm font-medium border border-red-200 flex items-center gap-3 animate-fade-in">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {{ mensajeError }}
      </div>
    }

    <form (ngSubmit)="registrarse()" #formRef="ngForm" class="space-y-6">

      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-widest mb-4">Datos Personales</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre</label>
            <input [(ngModel)]="usuario.nombre" name="nombre" type="text" required
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Ej: Kevin">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Apellido</label>
            <input [(ngModel)]="usuario.apellido" name="apellido" type="text" required
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Ej: Pedrera">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Cédula</label>
            <input [(ngModel)]="usuario.cedula" name="cedula" type="text" maxlength="10" required (input)="soloNumeros($event)"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="1717...">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono</label>
            <input [(ngModel)]="usuario.telefono" name="telefono" type="text" maxlength="10" required (input)="soloNumeros($event)"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="099...">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección</label>
            <input [(ngModel)]="usuario.direccion" name="direccion" type="text" required
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Tu ciudad y sector">
          </div>
        </div>
      </div>

      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-widest mb-4">Credenciales de Acceso</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Perfil en la plataforma</label>
            <div class="relative">
                <select [(ngModel)]="usuario.perfil" name="perfil" required
                  class="w-full px-4 py-3 border border-slate-200 bg-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all appearance-none cursor-pointer">
                  <option value="" disabled selected>Selecciona tu rol principal...</option>
                  <option value="estudiante">Docente en formación / Estudiante</option>
                  <option value="profesor">Profesor Especialista</option>
                  <option value="admin">Administrador Institucional</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
            <input [(ngModel)]="usuario.email" name="email" type="email" required
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="correo@ejemplo.com">
          </div>

          <div class="relative">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
            <input [(ngModel)]="usuario.password" name="password" [type]="mostrarPassword ? 'text' : 'password'" required minlength="6"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none pr-12 transition-all" placeholder="••••••••">
            
            <button type="button" (click)="togglePassword()" class="absolute right-4 top-[38px] text-slate-400 hover:text-indigo-600 focus:outline-none transition-colors">
              @if (mostrarPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
              }
            </button>
          </div>
        </div>
      </div>

      <div class="pt-4">
        <button type="submit" [disabled]="cargando || !formRef.valid"
          class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95 disabled:bg-slate-400 disabled:shadow-none flex justify-center items-center gap-2">
          
          @if (cargando) { 
            <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Creando cuenta... 
          } @else { 
            Finalizar Registro
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          }
        </button>
      </div>

      <div class="text-center mt-6">
        <p class="text-slate-600">
            ¿Ya tienes una cuenta? 
            <a routerLink="/login" class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors cursor-pointer">Inicia Sesión aquí</a>
        </p>
      </div>

    </form>
  </div>
</div>
