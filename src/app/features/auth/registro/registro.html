<div class="min-h-screen flex items-center justify-center bg-gray-50 py-10 px-4">
  <div class="max-w-2xl w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900">Registro de Usuario</h2>
      <p class="mt-2 text-sm text-gray-600">Completa tus datos correctamente</p>
    </div>

    @if (mensajeError) {
      <div class="bg-red-50 text-red-700 p-4 rounded-lg mb-6 text-sm border-l-4 border-red-500 animate-pulse">
        {{ mensajeError }}
      </div>
    }

    <form (ngSubmit)="registrarse()" #formRef="ngForm" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input 
            [(ngModel)]="usuario.nombre" 
            name="nombre" 
            type="text"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none"
            placeholder="Ej: Kevin">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
          <input 
            [(ngModel)]="usuario.apellido" 
            name="apellido" 
            type="text" 
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none" 
            placeholder="Ej: Pedrera">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cédula</label>
          <input 
            [(ngModel)]="usuario.cedula" 
            name="cedula" 
            type="text"
            maxlength="10"
            required
            (input)="soloNumeros($event)"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none" 
            placeholder="1717...">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
          <input 
            [(ngModel)]="usuario.telefono" 
            name="telefono" 
            type="text"
            maxlength="10"
            required
            (input)="soloNumeros($event)"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none" 
            placeholder="099...">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
          <input 
            [(ngModel)]="usuario.direccion" 
            name="direccion" 
            type="text" 
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none" 
            placeholder="Tu dirección completa">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Perfil</label>
          <select 
            [(ngModel)]="usuario.perfil" 
            name="perfil" 
            required
            class="w-full px-4 py-2 border border-gray-300 bg-white rounded-lg focus:ring-blue-500 outline-none">
            <option value="">Seleccione una opción</option>
            <option value="estudiante">Estudiante</option>
            <option value="profesor">Profesor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
          <input 
            [(ngModel)]="usuario.email" 
            name="email" 
            type="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none"
            placeholder="correo@ejemplo.com">
        </div>

        <div class="relative">
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          
          <input 
            [(ngModel)]="usuario.password" 
            name="password" 
            [type]="mostrarPassword ? 'text' : 'password'"
            required
            minlength="6"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 outline-none pr-10"
            placeholder="********">

          <button 
            type="button" 
            (click)="togglePassword()" 
            class="absolute right-3 top-9 text-gray-500 hover:text-blue-600 focus:outline-none">

            @if (mostrarPassword) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
            }

          </button>
        </div>

      </div>

      <button 
        type="submit" 
        [disabled]="cargando || !formRef.valid"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-lg transition-all disabled:bg-gray-400">
        @if (cargando) { Registrando... } @else { Crear Cuenta }
      </button>

      <div class="text-center mt-4">
        <a routerLink="/login" class="text-sm text-blue-600 font-semibold hover:underline">
          ¿Ya tienes cuenta? Inicia Sesión
        </a>
      </div>

    </form>
  </div>
</div>
